name = "RealQuadraticFields"
version = "0.1.0"
keywords = ["math", "number-theory"]
defaultTargets = ["RealQuadraticFields", "RealQuadraticFieldsTests"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Configure license headers separately when the project chooses a license.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "RealQuadraticFields"

[[lean_lib]]
name = "RealQuadraticFieldsTests"
